name = "webstudio-app"
main = "worker/index.ts"
compatibility_date = "2026-03-01"

[assets]
directory = "./dist"
binding = "STATIC"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*" ]

# Chạy cục bộ không cần tài khoản. Trước khi đưa lên Cloudflare,
# tạo database thật bằng `wrangler d1 create webstudio-app` rồi thay database_id.
[[d1_databases]]
binding = "DB"
database_name = "webstudio-app"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "webstudio-assets"

[vars]
APP_ORIGIN = "http://127.0.0.1:5173"

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true
